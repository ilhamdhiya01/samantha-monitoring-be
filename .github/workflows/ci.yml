name: CI

on:
  push:
  pull_request:
  # docker-publish.yml memanggil workflow ini sebagai gerbang.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: 0

      # Banyak file mengimpor tipe dari src/generated/prisma.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm exec eslint "{src,test}/**/*.ts"

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test && pnpm test:e2e

      - name: Build
        run: pnpm run build
