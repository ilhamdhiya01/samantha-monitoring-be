name: Build, push & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # VPS x86_64 → amd64 saja (lebih cepat dari multi-arch).
      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner

      # Tag `-migrator` dipakai service monitor-migrate di docker-compose.yml.
      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest-migrator
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-migrator
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  # Secrets repo: VPS_HOST, VPS_USER, VPS_SSH_KEY. docker-compose.yml dan
  # .env di VPS dikelola manual (lihat README "Deploy di VPS"); job ini hanya
  # menarik image baru. `up -d` menjalankan ulang monitor-migrate
  # (prisma migrate deploy idempoten).
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/dashboard-monitoring/samantha-monitoring-be
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
