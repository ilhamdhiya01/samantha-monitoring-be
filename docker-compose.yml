# Dipakai di VPS (~/dashboard-monitoring/samantha-monitoring-be) dan lokal.
# VPS: `docker compose pull && docker compose up -d` (lihat
# .github/workflows/docker-publish.yml). Lokal: `docker compose up -d
# monitor-db` saja, atau `--build` untuk mencoba image.
# Kalau monitor mati, service lain di VPS tidak terpengaruh.

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: '3'

services:
  # Docker API read-only. Mount socket `:ro` saja TIDAK cukup: itu hanya
  # melarang mengganti file socket, POST tetap jalan (= root di VPS).
  # Proxy ini menolak semua yang tidak di-whitelist, termasuk POST.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EVENTS: 1
      INFO: 1
      SYSTEM: 1
      PING: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitor]
    logging: *logging

  # Terpisah dari Postgres aplikasi lain: container, volume, port sendiri.
  # Port 5432 tidak di-publish (dev: lihat docker-compose.override.yml).
  monitor-db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: monitor_db
    volumes:
      - monitor_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitor -d monitor_db']
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [monitor]
    logging: *logging

  # Job sekali jalan: prisma migrate deploy, lalu selesai.
  monitor-migrate:
    image: ghcr.io/ilhamdhiya01/samantha-monitoring-be:${IMAGE_TAG:-latest}-migrator
    build:
      context: .
      target: migrator
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://monitor:${POSTGRES_PASSWORD}@monitor-db:5432/monitor_db
    depends_on:
      monitor-db:
        condition: service_healthy
    networks: [monitor]
    logging: *logging

  monitor-api:
    image: ghcr.io/ilhamdhiya01/samantha-monitoring-be:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://monitor:${POSTGRES_PASSWORD}@monitor-db:5432/monitor_db
      DOCKER_HOST: tcp://docker-proxy:2375
      HOST_PROC: /host/proc
      HOST_ROOT: /host
    # Loopback saja — belum ada login. Akses lewat SSH tunnel; FE
    # (samantha-monitoring-fe) memanggilnya lewat network `monitor`.
    ports:
      - '127.0.0.1:3300:3001'
    volumes:
      # Resource host (bukan milik container), read-only.
      - /proc:/host/proc:ro
      - /:/host:ro
    depends_on:
      monitor-migrate:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/api/v1/health', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [monitor]
    logging: *logging

networks:
  # Nama tetap: compose FE bergabung ke network ini (external).
  monitor:
    name: monitor

volumes:
  monitor_db_data:
